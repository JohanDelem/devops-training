name: my ci pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      
      - name: Install
        run: npm install
      
      - name: Test
        run: node app_tests_home.test.tsx