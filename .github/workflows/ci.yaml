name: CI
on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: install node
        uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: npm install
        run: npm install

      - name: build
        run: npm run build

      - name: start app
        run: npm run start &

      - name: wait for app
        run: npx wait-on http://127.0.0.1:3000

      - name: test
        run: npx tsx app/__tests__/accueil.test.tsx